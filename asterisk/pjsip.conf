; Asterisk 20 PJSIP config for the turret-ua interop run.
; Three endpoints that must REGISTER with digest auth; Asterisk relays RTP
; (direct_media=no) so turret-ua's media really goes through the PBX.
[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5060

[endpoint-tpl](!)
type=endpoint
context=turret
disallow=all
allow=ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth-tpl](!)
type=auth
auth_type=userpass

[aor-tpl](!)
type=aor
max_contacts=1
remove_existing=yes

[alice](endpoint-tpl)
auth=alice
aors=alice
[alice](auth-tpl)
username=alice
password=alice-pw
[alice](aor-tpl)

[bob](endpoint-tpl)
auth=bob
aors=bob
[bob](auth-tpl)
username=bob
password=bob-pw
[bob](aor-tpl)

[carol](endpoint-tpl)
auth=carol
aors=carol
[carol](auth-tpl)
username=carol
password=carol-pw
[carol](aor-tpl)
